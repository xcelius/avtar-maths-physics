<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Notes View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .pdf-window { width: 100%; height: 70vh; border: 2px solid #000000; border-radius: 4px; background-color: #f9f9f9; }
        .bottom-panel { display: flex; justify-content: center; padding: 10px 0; width: 100%; }
        .finish-btn { border: 3px solid #000000; background-color: #ffffff; color: #000000; font-size: 16px; font-weight: bold; padding: 12px 40px; cursor: pointer; text-decoration: none; text-align: center; }
        .finish-btn:hover { background-color: #000000; color: #ffffff; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main PDF Document View -->
        <iframe id="pdf-viewer" class="pdf-window" src="" type="application/pdf"></iframe>
        
        <!-- Bottom Panel containing just the Return navigation button -->
        <div class="bottom-panel">
            <a href="notes.html" class="finish-btn">FINISH</a>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (id) { 
            document.getElementById('pdf-viewer').src = `pdfs_notes/${id}.pdf`; 
        } else {
            document.write("Error: No note ID specified.");
        }
    </script>
</body>
</html>
