<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Exam View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .pdf-window { width: 100%; height: 65vh; border: 2px solid #000000; border-radius: 4px; background-color: #f9f9f9; }
        .bottom-panel { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; width: 100%; }
        .omr-sheet { display: flex; flex-direction: column; gap: 12px; }
        .question-row { display: flex; align-items: center; font-size: 16px; font-weight: bold; }
        .question-label { width: 40px; }
        .options { display: flex; gap: 15px; }
        .option-label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: normal; }
        .finish-btn { border: 3px solid #000000; background-color: #ffffff; color: #000000; font-size: 16px; font-weight: bold; padding: 12px 30px; cursor: pointer; }
        .finish-btn:hover { background-color: #000000; color: #ffffff; }
        .result-box { display: none; margin-top: 15px; padding: 15px; border: 2px solid #000000; background-color: #f0fdf4; text-align: center; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <iframe id="pdf-viewer" class="pdf-window" src="" type="application/pdf"></iframe>
        <div class="bottom-panel">
            <div class="omr-sheet" id="omr-target"></div>
            <button class="finish-btn" onclick="checkAnswers()">FINISH</button>
        </div>
        <div id="result" class="result-box"></div>
    </div>
        <script>
        // 1. Get Topic ID parameter from the URL string
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (id) { document.getElementById('pdf-viewer').src = `pdfs_exams/${id}.pdf`; }
        
        // 2. MASTER ANSWER KEYS DATABASE LOOKUP
        // Simply change these letters to your real answer keys whenever they are ready!
        const examAnswersDatabase = {

            "mmet47a": ["A", "A", "A", "A", "A"],

            // === PHYSICS (Forms 4 - 5: Topics pmet1a to pmet13a) ===
            "pmet1a":  ["A", "A", "A", "A", "A"],
            "pmet2a":  ["A", "A", "A", "A", "A"],

            "pmet12a": ["A", "A", "A", "A", "A"],
            "pmet13a": ["A", "A", "A", "A", "A"]
        };

        // 3. Dynamically build the 5 row OMR sheet options
        const omr = document.getElementById('omr-target');
        for(let i=1; i<=5; i++) {
            omr.innerHTML += `<div class="question-row"><span class="question-label">Q${i}</span><div class="options">` +
                `A B C D E`.split(' ').map(ch => `<label class="option-label"><input type="radio" name="q${i}" value="${ch}"> ${ch}</label>`).join('') +
                `</div></div>`;
        }

        // 4. Advanced Database Grading Engine
        function checkAnswers() {
            const activeAnswerKeyLookup = id + "a";
            const correctAnswersArray = examAnswersDatabase[activeAnswerKeyLookup];

            if (!correctAnswersArray) {
                alert("Error: Answer key data for this topic is missing or still being compiled.");
                return;
            }

            let score = 0;
            for (let i = 1; i <= 5; i++) {
                const checkedOption = document.querySelector(`input[name="q${i}"]:checked`);
                if (checkedOption && checkedOption.value === correctAnswersArray[i - 1]) {
                    score++;
                }
            }

            const rb = document.getElementById('result');
            rb.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 10px;">
                    <span>Your Score: ${score} / 5 (${(score / 5) * 100}%)</span>
                    <a href="mockexam.html" style="border: 2px solid #000000; background-color: #ffffff; color: #000000; font-size: 14px; font-weight: bold; padding: 8px 25px; text-decoration: none; cursor: pointer; transition: background-color 0.2s;">BACK</a>
                </div>
            `;
            rb.style.display = 'block';
            rb.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
